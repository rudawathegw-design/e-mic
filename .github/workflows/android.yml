name: Build E Mic Android

# Builds a debug APK you can install directly. Runs on Android version tags
# (e.g. android-v1.0.0) or on demand. Pulls in whisper.cpp + a Whisper model so
# the produced APK actually transcribes; the license SECRET is injected from the
# same repo secret the desktop build uses.
on:
  push:
    tags:
      - "android-v*"
  workflow_dispatch:

permissions:
  contents: write   # attach the APK to a Release on tag builds

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK (+ NDK & CMake)
        uses: android-actions/setup-android@v3

      - name: Install NDK & CMake
        run: |
          yes | sdkmanager "ndk;26.1.10909125" "cmake;3.22.1" >/dev/null

      - name: Vendor whisper.cpp
        run: |
          git clone --depth 1 https://github.com/ggerganov/whisper.cpp \
            app/src/main/cpp/whisper

      - name: Download Whisper model (tiny.en, q5_1 quantised ~31 MB — fast)
        run: |
          mkdir -p app/src/main/assets/models
          curl -L --fail -o app/src/main/assets/models/ggml-model.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en-q5_1.bin

      - name: Inject license SECRET from repo secret
        env:
          LICENSE_SECRET: ${{ secrets.LICENSE_SECRET }}
        run: |
          SECRET="${LICENSE_SECRET:-0}"
          sed -i "s/private const val SECRET = .*/private const val SECRET = ${SECRET}/" \
            app/src/main/java/iq/fib/eamic/license/License.kt
          echo "Set SECRET in License.kt to ${SECRET}"

      - name: Decode signing keystore (if configured)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/emic-release.p12"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/emic-release.p12" >> "$GITHUB_ENV"
            echo "Keystore decoded — release build will be signed."
          else
            echo "No keystore secret set — release build will be unsigned."
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK (signed if keystore present)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: gradle assembleRelease --no-daemon

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/EMic-android.apk \
            || cp app/build/outputs/apk/release/app-release-unsigned.apk out/EMic-android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EMic-android
          path: android/out/EMic-android.apk

      # The in-app self-updater (Updater.kt) reads `versionCode=N` from the
      # release body to decide whether an installed build is out of date.
      # `min=N` (optional) forces everyone below that code to update.
      - name: Read versionCode from build.gradle.kts
        id: ver
        run: |
          CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts | head -1)
          NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "versionCode=$CODE versionName=$NAME"

      # Publish to the dedicated Android repo so the desktop app's
      # electron-updater never sees these releases as "latest" in the main repo.
      - name: Publish APK to e-mic-android Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          repository: rudawathegw-design/e-mic-android
          token: ${{ secrets.ANDROID_RELEASE_TOKEN }}
          tag_name: ${{ github.ref_name }}
          target_commitish: main
          files: android/out/EMic-android.apk
          name: E Mic ${{ steps.ver.outputs.name }}
          body: |
            E Mic ${{ steps.ver.outputs.name }}

            versionCode=${{ steps.ver.outputs.code }}
            # To force everyone below a build to update, add e.g.  min=${{ steps.ver.outputs.code }}
