name: Build E Mic Android

# Builds a debug APK you can install directly. Runs on Android version tags
# (e.g. android-v1.0.0) or on demand. Pulls in whisper.cpp + a Whisper model so
# the produced APK actually transcribes; the license SECRET is injected from the
# same repo secret the desktop build uses.
on:
  push:
    tags:
      - "android-v*"
  workflow_dispatch:

permissions:
  contents: write   # attach the APK to a Release on tag builds

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK (+ NDK & CMake)
        uses: android-actions/setup-android@v3

      - name: Install NDK & CMake
        run: |
          yes | sdkmanager "ndk;26.1.10909125" "cmake;3.22.1" >/dev/null

      - name: Vendor whisper.cpp
        run: |
          git clone --depth 1 https://github.com/ggerganov/whisper.cpp \
            app/src/main/cpp/whisper

      - name: Download Whisper model (base.en)
        run: |
          mkdir -p app/src/main/assets/models
          curl -L --fail -o app/src/main/assets/models/ggml-base.en.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en.bin

      - name: Inject license SECRET from repo secret
        env:
          LICENSE_SECRET: ${{ secrets.LICENSE_SECRET }}
        run: |
          SECRET="${LICENSE_SECRET:-0}"
          sed -i "s/private const val SECRET = .*/private const val SECRET = ${SECRET}/" \
            app/src/main/java/iq/fib/eamic/license/License.kt
          echo "Set SECRET in License.kt to ${SECRET}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/EMic-android-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EMic-android-debug
          path: android/out/EMic-android-debug.apk

      - name: Attach APK to Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/out/EMic-android-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
